<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstateIQ ERD</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #111111;
      font-size: 22px;
      margin-bottom: 4px;
    }
    p {
      color: #444444;
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #erd {
      width: 100%;
      overflow-x: auto;
    }
    #erd svg {
      min-width: 900px;
    }
    #erd svg text,
    #erd svg tspan {
      fill: #111111 !important;
      color: #111111 !important;
    }
  </style>
</head>
<body>
  <h1>EstateIQ — Entity Relationship Diagram</h1>
  <p>24 tables · Monolithic Real Estate Management System · University Project Draft</p>
  <div id="erd"></div>

  <script type="module">
    import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';

    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      fontFamily: 'Arial, sans-serif',
      themeVariables: {
        darkMode: false,
        fontSize: '12px',
        fontFamily: 'Arial, sans-serif',
        lineColor: '#333333',
        textColor: '#111111',
        primaryColor: '#dde8ff',
        primaryBorderColor: '#5566cc',
        primaryTextColor: '#111111',
        secondaryColor: '#d4f0e4',
        secondaryBorderColor: '#2a8c60',
        secondaryTextColor: '#111111',
        tertiaryColor: '#fff3d4',
        tertiaryBorderColor: '#cc8800',
        tertiaryTextColor: '#111111',
        edgeLabelBackground: '#ffffff',
        attributeBackgroundColorEven: '#eef3ff',
        attributeBackgroundColorOdd: '#f8faff',
      },
    });

    const diagram = `erDiagram
  USERS {
    uuid id PK
    string name
    string email
    string password_hash
    boolean is_active
    timestamp created_at
    timestamp updated_at
  }
  ROLES {
    uuid id PK
    string name
    string description
    timestamp created_at
  }
  USER_ROLES {
    uuid id PK
    uuid user_id FK
    uuid role_id FK
    timestamp assigned_at
  }
  PERMISSIONS {
    uuid id PK
    string name
    string description
    string resource
    string action
  }
  ROLE_PERMISSIONS {
    uuid id PK
    uuid role_id FK
    uuid permission_id FK
  }
  REFRESH_TOKENS {
    uuid id PK
    uuid user_id FK
    string token
    timestamp expires_at
    boolean is_revoked
    timestamp created_at
  }
  AUDIT_LOGS {
    uuid id PK
    uuid user_id FK
    string action
    string entity_type
    uuid entity_id
    jsonb metadata
    string ip_address
    timestamp created_at
  }
  NOTIFICATIONS {
    uuid id PK
    uuid user_id FK
    string type
    string title
    string message
    boolean is_read
    timestamp created_at
  }
  SETTINGS {
    uuid id PK
    string key
    text value
    string description
    timestamp updated_at
  }
  FILES {
    uuid id PK
    uuid user_id FK
    string filename
    string url
    string mime_type
    integer size_bytes
    string entity_type
    uuid entity_id
    timestamp created_at
  }
  PROPERTY_TYPES {
    uuid id PK
    string name
    string description
  }
  PROPERTY_STATUSES {
    uuid id PK
    string name
    string description
  }
  LISTING_TYPES {
    uuid id PK
    string name
  }
  LOCATIONS {
    uuid id PK
    string address
    string city
    string state
    string country
    string postal_code
    float latitude
    float longitude
  }
  PROPERTIES {
    uuid id PK
    uuid owner_id FK
    uuid type_id FK
    uuid status_id FK
    uuid location_id FK
    string title
    text description
    float price
    integer bedrooms
    integer bathrooms
    float area_sqft
    integer year_built
    timestamp created_at
    timestamp updated_at
  }
  PROPERTY_LISTINGS {
    uuid id PK
    uuid property_id FK
    uuid listing_type_id FK
    float asking_price
    boolean is_active
    date listed_at
    date expires_at
    timestamp created_at
    timestamp updated_at
  }
  PROPERTY_IMAGES {
    uuid id PK
    uuid property_id FK
    string url
    string alt_text
    boolean is_primary
    integer sort_order
    timestamp created_at
  }
  PROPERTY_FEATURES {
    uuid id PK
    uuid property_id FK
    string feature_name
    string feature_value
  }
  PROPERTY_VIEWS {
    uuid id PK
    uuid property_id FK
    uuid user_id FK
    string ip_address
    string referrer
    timestamp viewed_at
  }
  FAVORITES {
    uuid id PK
    uuid user_id FK
    uuid property_id FK
    timestamp created_at
  }
  INQUIRIES {
    uuid id PK
    uuid user_id FK
    uuid listing_id FK
    text message
    string status
    timestamp created_at
    timestamp updated_at
  }
  MESSAGE_THREADS {
    uuid id PK
    uuid initiator_id FK
    uuid recipient_id FK
    uuid listing_id FK
    timestamp created_at
    timestamp updated_at
  }
  MESSAGES {
    uuid id PK
    uuid thread_id FK
    uuid sender_id FK
    text body
    boolean is_read
    timestamp created_at
  }
  APPOINTMENTS {
    uuid id PK
    uuid listing_id FK
    uuid visitor_id FK
    uuid host_id FK
    timestamp scheduled_at
    integer duration_minutes
    string status
    text notes
    timestamp created_at
    timestamp updated_at
  }

  USERS ||--o{ USER_ROLES : "has"
  ROLES ||--o{ USER_ROLES : "assigned to"
  ROLES ||--o{ ROLE_PERMISSIONS : "has"
  PERMISSIONS ||--o{ ROLE_PERMISSIONS : "granted via"
  USERS ||--o{ REFRESH_TOKENS : "owns"
  USERS ||--o{ AUDIT_LOGS : "generates"
  USERS ||--o{ NOTIFICATIONS : "receives"
  USERS ||--o{ FILES : "uploads"
  USERS ||--o{ PROPERTIES : "owns"
  PROPERTY_TYPES ||--o{ PROPERTIES : "categorises"
  PROPERTY_STATUSES ||--o{ PROPERTIES : "classifies"
  LOCATIONS ||--o{ PROPERTIES : "locates"
  PROPERTIES ||--o{ PROPERTY_LISTINGS : "listed as"
  LISTING_TYPES ||--o{ PROPERTY_LISTINGS : "defines"
  PROPERTIES ||--o{ PROPERTY_IMAGES : "has"
  PROPERTIES ||--o{ PROPERTY_FEATURES : "has"
  PROPERTIES ||--o{ PROPERTY_VIEWS : "tracked by"
  USERS ||--o{ PROPERTY_VIEWS : "generates"
  USERS ||--o{ FAVORITES : "saves"
  PROPERTIES ||--o{ FAVORITES : "saved in"
  USERS ||--o{ INQUIRIES : "submits"
  PROPERTY_LISTINGS ||--o{ INQUIRIES : "receives"
  USERS ||--o{ MESSAGE_THREADS : "initiates"
  PROPERTY_LISTINGS ||--o{ MESSAGE_THREADS : "about"
  MESSAGE_THREADS ||--o{ MESSAGES : "contains"
  USERS ||--o{ MESSAGES : "sends"
  PROPERTY_LISTINGS ||--o{ APPOINTMENTS : "booked for"
  USERS ||--o{ APPOINTMENTS : "visits"
`;

    const { svg } = await mermaid.render('erd-svg-export', diagram);
    document.getElementById('erd').innerHTML = svg;

    document.querySelectorAll('#erd svg text, #erd svg tspan').forEach(el => {
      el.setAttribute('fill', '#111111');
      el.style.fill = '#111111';
    });

    document.querySelectorAll('#erd svg .node').forEach(node => {
      const firstPath = node.querySelector('path[d]');
      if (!firstPath) return;
      const d = firstPath.getAttribute('d');
      const nums = d.match(/-?[\d.]+/g)?.map(Number);
      if (!nums || nums.length < 8) return;
      const xs = [nums[0], nums[2], nums[4], nums[6]];
      const ys = [nums[1], nums[3], nums[5], nums[7]];
      const x = Math.min(...xs), y = Math.min(...ys);
      const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x); rect.setAttribute('y', y);
      rect.setAttribute('width', w); rect.setAttribute('height', h);
      rect.setAttribute('rx', '8');
      for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
        if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
      }
      firstPath.replaceWith(rect);
    });

    document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
      p.setAttribute('stroke', 'none');
    });
  </script>
</body>
</html>
